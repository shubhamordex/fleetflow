spring.application.name=fleetflow

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fleetflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=FleetFlowSecretKey2024VeryLongSecretKeyForJWTTokenGeneration123456789
jwt.expiration=86400000

# Server Configuration
server.port=8080

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Show SQL queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Boot logs
logging.level.org.springframework=INFO
logging.level.com.yourpackage=DEBUG

# Show full error stacktrace
logging.level.root=INFO
